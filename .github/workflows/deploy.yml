name: Deploy PropertyLite to ECS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::456421176448:role/github-actions-deploy-role
          aws-region: us-east-1

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          cd propertylite
          docker build -t ${{ steps.login-ecr.outputs.registry }}/property-api:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/property-api:latest

      - name: Redeploy
        run: |
          aws ecs update-service --cluster training-cluster --service property-api-service --force-new-deployment
          aws ecs wait services-stable --cluster training-cluster --services property-api-service
